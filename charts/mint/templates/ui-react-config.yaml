{{- if .Values.components.ui_react.enabled }}
{{- $cfg := .Values.components.ui_react.config }}
{{- if not $cfg.client_id }}
{{- fail "components.ui_react.config.client_id must not be empty when components.ui_react.enabled is true. An identity provider allows one callback URL per client, so the client set here must be the one whose callback URL is this deployment's own origin. Where the React UI takes over the legacy UI's host, that is the legacy UI's client -- the two never serve the origin at once. Register or reuse a client for this deployment's host and set components.ui_react.config.client_id." }}
{{- end }}
{{- /*
CKAN base URL for this deployment, when it is an external CKAN rather than the
chart's own data_catalog component. ui-config.yaml reads the same value for the
legacy UI, so the two UIs cannot disagree about which catalog they are in.
*/}}
{{- $ckanUrl := "" }}
{{- if .Values.external_services.ckan.enabled }}
{{- $ckanUrl = .Values.external_services.ckan.url }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mint.prefix" . }}-ui-react-config-map
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
data:
  # Consumed as environment variables by the image's entrypoint, which renders
  # them into the runtime config script at startup. The generator in the image
  # -- not this template -- owns the config shape and its defaults, so a key
  # omitted here falls back to that default rather than being blanked out.

  # Service endpoints, derived from each component's own ingress declaration
  # unless overridden explicitly on ui_react.config.
  {{- with include "mint.ui_react.endpoint" (dict "override" $cfg.hasura_endpoint "component" .Values.components.hasura "suffix" "/v1/graphql") }}
  HASURA_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- /*
  An external CKAN takes precedence over the data_catalog component, matching
  ui-config.yaml, where the external_services block is written last and wins.
  Without this the key is omitted on a deployment that uses an external CKAN,
  and the application falls back to a compiled-in default -- correct only by
  coincidence.
  */}}
  {{- with $cfg.data_catalog_api | default $ckanUrl | default (include "mint.component_url" (dict "component" .Values.components.data_catalog)) }}
  DATA_CATALOG_API: {{ . | quote }}
  {{- end }}
  {{- with include "mint.ui_react.endpoint" (dict "override" $cfg.ensemble_manager_api "component" .Values.components.ensemble_manager "suffix" (printf "/%s" (default "" .Values.components.ensemble_manager.api_version))) }}
  ENSEMBLE_MANAGER_API: {{ . | quote }}
  {{- end }}

  # Which execution backend this deployment's Ensemble Manager runs, so the
  # application posts run submissions to the route that backend actually
  # serves. It is a property of the deployment, not a user choice -- so it is
  # derived from the Ensemble Manager's own configuration, the same value
  # ui-config.yaml gives the legacy UI. Override only to point this UI at an
  # execution engine other than the one this chart configures.
  {{- with $cfg.execution_engine | default (dig "config" "execution_engine" "type" "" .Values.components.ensemble_manager) }}
  EXECUTION_ENGINE: {{ . | quote }}
  {{- end }}

  # Authentication. Server and provider are inherited from the chart's
  # top-level auth values; the client ID is deliberately per-component.
  # Keycloak is not plumbed through the chart, so AUTH_REALM is not emitted.
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  AUTH_SERVER: {{ .Values.auth.server | quote }}
  AUTH_CLIENT_ID: {{ $cfg.client_id | quote }}
  {{- with $cfg.auth_callback_origin }}
  AUTH_CALLBACK_ORIGIN: {{ . | quote }}
  {{- end }}

  {{- with $cfg.branding }}
  # Presentation. Which co-branding chrome the application renders -- the
  # branding strip, the footer and the dark header. It names a preset held in
  # the image, so the logo files, link targets and alt text stay under code
  # review rather than living in these values. Set only on a deployment
  # entitled to show that institution's marks; left empty the key is omitted
  # and the image's own default applies, which is unbranded.
  BRANDING: {{ . | quote }}
  {{- end }}

  {{- with .Values.welcome_message }}
  WELCOME_MESSAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.google.maps.key }}
  GOOGLE_MAPS_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
