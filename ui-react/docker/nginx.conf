# Static-file routing for the MINT React UI.
#
# Application routes mirror vercel.json; container-only /docs/ serves MkDocs:
#   - every path that is not an existing file falls back to /index.html, so deep
#     links, browser refresh, and the OAuth callback route load the application
#     instead of 404ing;
#   - hashed assets under /assets/ carry a long-lived immutable cache header.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed filenames — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Regenerated at container startup; must never be cached.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Documentation must never fall through to the React application.
    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback for everything else.
    location / {
        try_files $uri /index.html;
    }
}
