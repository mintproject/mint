mutation SaveConfigurationMetadata($id: String!, $label: String!, $description: String) {
  update_modelcatalog_configuration_by_pk(
    pk_columns: { id: $id }
    _set: { label: $label, description: $description }
  ) {
    id
    label
    description
  }
}

mutation AddConfigurationInput(
  $configurationId: String!
  $isOptional: Boolean!
  $inputId: String!
  $inputLabel: String!
  $inputDescription: String
  $hasFormat: String
  $hasDimensionality: Int
  $position: Int!
  $presentations: [modelcatalog_dataset_specification_presentation_insert_input!]!
) {
  insert_modelcatalog_configuration_input_one(
    object: {
      configuration_id: $configurationId
      is_optional: $isOptional
      input: {
        data: {
          id: $inputId
          label: $inputLabel
          description: $inputDescription
          has_format: $hasFormat
          has_dimensionality: $hasDimensionality
          position: $position
          presentations: { data: $presentations }
        }
      }
    }
  ) {
    configuration_id
    input_id
    is_optional
    input {
      id
      label
    }
  }
}

