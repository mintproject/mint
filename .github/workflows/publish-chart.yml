name: Publish Chart

# Add one packaged chart to the Helm repository on the gh-pages branch.
#
# The layout is the one the old `mintproject/mint-chart-archive` Makefile made, so every
# historical URL keeps working:
#
#   gh-pages/index.yaml
#   gh-pages/releases/MINT-<version>.tgz
#
# The URL is fixed, not derived from the repository name. Pages serves this
# repository at /mint only after the rename (ADR-0005). An entry written with
# /monorepo would die at the cutover.
#
# A plain `helm repo index --merge` over gh-pages would re-index all 142 old
# tarballs and rewrite their `created` stamps. So the new tarball is indexed in
# an empty directory and merged into the old index. Old entries stay
# byte-for-byte.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to package, usually the chart tag
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package, for example MINT-9.0.0-beta.18
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: publish-chart
  cancel-in-progress: false

env:
  CHART_REPO_URL: https://mintproject.github.io/mint

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the chart
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4

      - name: Package and index
        run: |
          mkdir new
          helm package src/charts/mint -d new
          pkg=$(ls new/*.tgz)
          file=$(basename "$pkg")
          if [ -e "site/releases/$file" ]; then
            echo "::error::$file is already published. A chart version must not be published twice."
            exit 1
          fi
          helm repo index new --url "$CHART_REPO_URL/releases" --merge site/index.yaml
          mkdir -p site/releases
          mv "$pkg" site/releases/
          mv new/index.yaml site/index.yaml
          echo "FILE=$file" >> "$GITHUB_ENV"

      - name: Push gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yaml "releases/$FILE"
          git commit -m "chore(chart): publish $FILE"
          git push origin gh-pages
