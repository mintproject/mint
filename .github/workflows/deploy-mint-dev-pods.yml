name: Deploy MINT Dev Pods

on:
  workflow_run:
    workflows: [MINT Dev Images]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: mint-dev-pods
  cancel-in-progress: false

jobs:
  plan:
    name: Validate deploy manifest
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
      }}
    outputs:
      has_changes: ${{ steps.validate.outputs.has_changes }}
      build_services: ${{ steps.validate.outputs.build_services }}
      restart_services: ${{ steps.validate.outputs.restart_services }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
      schema_changed: ${{ steps.validate.outputs.schema_changed }}
      deploy_all: ${{ steps.validate.outputs.deploy_all }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      images_json: ${{ steps.validate.outputs.images_json }}
      deploy_images_json: ${{ steps.validate.outputs.deploy_images_json }}
    steps:
      - name: Check out the workflow source commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check out the manually dispatched ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Download exact build manifest
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: mint-dev-change-plan-${{ github.event.workflow_run.id }}
          path: manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create manual full-deploy manifest
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p manifest
          python - <<'PY'
          import json
          # PostgreSQL is persistent state. A manual application deploy must
          # not migrate or restart it; database image changes are selected
          # only by an explicit postgres source change in the manifest.
          services = ["graphql", "api", "ensemble", "svo", "semantic_search", "ui"]
          images = {
              service: {
                  "image": f"ghcr.io/mintproject/{name}",
                  "tag": "develop",
                  "image_ref": f"ghcr.io/mintproject/{name}:develop",
              }
              for service, name in {
                  "graphql": "graphql-engine",
                  "api": "model-catalog-api",
                  "ensemble": "ensemble-manager",
                  "svo": "svo-adapter",
                  "semantic_search": "semantic-search",
                  "ui": "ui",
              }.items()
          }
          with open("manifest/changed-services.json", "w", encoding="utf-8") as stream:
              json.dump({
                  "schema_version": 1,
                  "source_sha": "manual",
                  "short_sha": "manual",
                  "build_services": services,
                  "restart_services": services,
                  "schema_changed": True,
                  "deploy_all": True,
                  "images": images,
                  "has_changes": True,
                  "matrix": {"include": []},
              }, stream, indent=2)
              stream.write("\n")
          PY

      - name: Validate exact manifest and export deploy plan
        id: validate
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from deploy.mint_change_plan import develop_image_map

          path = Path("manifest/changed-services.json")
          try:
              plan = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"invalid deploy manifest: {exc}") from exc

          required = {
              "schema_version", "source_sha", "build_services", "restart_services",
              "short_sha", "schema_changed", "deploy_all", "has_changes", "images",
          }
          missing = required - plan.keys()
          if missing:
              raise SystemExit("deploy manifest is missing: " + ", ".join(sorted(missing)))
          if plan["schema_version"] != 1:
              raise SystemExit("unsupported deploy manifest schema")
          expected_sha = os.environ.get("EXPECTED_SHA", "")
          if os.environ["EVENT_NAME"] == "workflow_run" and plan["source_sha"] != expected_sha:
              raise SystemExit("deploy manifest source_sha does not match the completed build run")
          if os.environ["EVENT_NAME"] == "workflow_run" and plan["short_sha"] != plan["source_sha"][:7]:
              raise SystemExit("deploy manifest short_sha does not match source_sha")
          if not isinstance(plan["build_services"], list) or not isinstance(plan["restart_services"], list):
              raise SystemExit("deploy manifest service sets must be arrays")
          if not isinstance(plan["images"], dict):
              raise SystemExit("deploy manifest images must be an object")
          services = {"postgres", "graphql", "api", "ensemble", "svo", "semantic_search", "ui"}
          if any(service not in services for service in plan["build_services"] + plan["restart_services"]):
              raise SystemExit("deploy manifest contains an invalid service name")
          if not isinstance(plan["schema_changed"], bool) or not isinstance(plan["deploy_all"], bool) or not isinstance(plan["has_changes"], bool):
              raise SystemExit("deploy manifest flags must be booleans")
          if plan["has_changes"] != bool(plan["build_services"] or plan["restart_services"]):
              raise SystemExit("deploy manifest has_changes flag is inconsistent with service sets")
          if any(service not in plan["images"] for service in plan["build_services"]):
              raise SystemExit("deploy manifest is missing an image for a build service")
          image_names = {
              "postgres": "postgres-pgvector",
              "graphql": "graphql-engine",
              "api": "model-catalog-api",
              "ensemble": "ensemble-manager",
              "svo": "svo-adapter",
              "semantic_search": "semantic-search",
              "ui": "ui",
          }
          if os.environ["EVENT_NAME"] == "workflow_run":
              for service in plan["build_services"]:
                  image = plan["images"][service]
                  image_name = image_names[service]
                  expected_ref = f"ghcr.io/mintproject/{image_name}:sha-{plan['short_sha']}"
                  if image.get("image_ref") != expected_ref or image.get("tag") != f"sha-{plan['short_sha']}":
                      raise SystemExit(f"deploy manifest image does not match source SHA for {service}")
          deploy_images = develop_image_map(plan["build_services"])

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"has_changes={str(bool(plan['has_changes'])).lower()}\n")
              stream.write(f"build_services={','.join(plan['build_services'])}\n")
              stream.write(f"restart_services={','.join(plan['restart_services'])}\n")
              stream.write("image_tag=develop\n")
              stream.write(f"schema_changed={str(bool(plan['schema_changed'])).lower()}\n")
              stream.write(f"deploy_all={str(bool(plan['deploy_all'])).lower()}\n")
              stream.write(f"source_sha={plan['source_sha']}\n")
              stream.write("images_json=" + json.dumps(plan["images"], separators=(",", ":")) + "\n")
              stream.write("deploy_images_json=" + json.dumps(deploy_images, separators=(",", ":")) + "\n")
          print(json.dumps(plan, indent=2))

  deploy:
    name: Deploy selected MINT dev services
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: Tapis Dev Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha != 'manual' && needs.plan.outputs.source_sha || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deploy dependencies
        run: pip install tapipy python-dotenv

      - name: Ensure wmobley is an approved admin on every pod
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
        run: |
          set -euo pipefail
          python deploy/tapis/register_mint_stack.py \
            --set-owners-only \
            --require-all-owner-grants \
            --pods all \
            --owners wmobley

      - name: Update application develop tags
        if: needs.plan.outputs.build_services != ''
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          SVO_ADAPTER_GEO_ACTOR_ID: ${{ vars.SVO_ADAPTER_GEO_ACTOR_ID }}
          IMAGE_MAP_JSON: ${{ needs.plan.outputs.deploy_images_json }}
          BUILD_SERVICES: ${{ needs.plan.outputs.build_services }}
        run: |
          set -euo pipefail
          APP_BUILD_SERVICES="$(python - "$BUILD_SERVICES" <<'PY'
          import sys
          print(",".join(service for service in sys.argv[1].split(",") if service and service not in {"postgres", "redis"}))
          PY
          )"
          if [[ -n "$APP_BUILD_SERVICES" ]]; then
            python deploy/tapis/register_mint_stack.py \
              --image-map "$IMAGE_MAP_JSON" \
              --pods "$APP_BUILD_SERVICES" \
              --update-images-only
          fi

      - name: Apply Hasura migrations and verify catalog
        if: needs.plan.outputs.schema_changed == 'true'
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          SVO_ADAPTER_GEO_ACTOR_ID: ${{ vars.SVO_ADAPTER_GEO_ACTOR_ID }}
          IMAGE_MAP_JSON: ${{ needs.plan.outputs.deploy_images_json }}
        run: |
          set -euo pipefail
          python deploy/tapis/register_mint_stack.py \
            --migrate-hasura \
            --pods graphql \
            --image-map "$IMAGE_MAP_JSON"

      - name: Apply SVO runtime configuration
        if: vars.SVO_ADAPTER_GEO_ACTOR_ID != '' && contains(needs.plan.outputs.restart_services, 'svo')
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          SVO_ADAPTER_GEO_ACTOR_ID: ${{ vars.SVO_ADAPTER_GEO_ACTOR_ID }}
          SVO_ADAPTER_RUN_SIGNAL_SECRETS: ${{ secrets.SVO_ADAPTER_RUN_SIGNAL_SECRETS }}
          # Per-run token lifetime and the token keeper (see
          # svo-adapter-service/app/run_tokens.py). Each value is applied to the
          # pod only when the variable/secret is set; an unset one leaves the
          # pod's current value alone (register_mint_stack._optional_env).
          SVO_ADAPTER_RUN_TOKEN_ENABLED: ${{ vars.SVO_ADAPTER_RUN_TOKEN_ENABLED }}
          SVO_ADAPTER_RUN_TOKEN_TTL_SECONDS: ${{ vars.SVO_ADAPTER_RUN_TOKEN_TTL_SECONDS }}
          SVO_ADAPTER_RUN_TOKEN_KEEPER_ENABLED: ${{ vars.SVO_ADAPTER_RUN_TOKEN_KEEPER_ENABLED }}
          SVO_ADAPTER_RUN_TOKEN_ENCRYPTION_KEYS: ${{ secrets.SVO_ADAPTER_RUN_TOKEN_ENCRYPTION_KEYS }}
          SVO_ADAPTER_RUN_TOKEN_KEEPER_SWEEP_ENABLED: ${{ vars.SVO_ADAPTER_RUN_TOKEN_KEEPER_SWEEP_ENABLED }}
        run: |
          set -euo pipefail
          python deploy/tapis/register_mint_stack.py \
            --sync-svo-runtime \
            --defer-svo-restart \
            --pods svo

      - name: Apply Ensemble runtime configuration
        if: contains(needs.plan.outputs.restart_services, 'ensemble')
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          UNIFIED_PLAN_SECRET: ${{ secrets.UNIFIED_PLAN_SECRET }}
        run: |
          set -euo pipefail
          python deploy/tapis/register_mint_stack.py \
            --sync-ensemble-config \
            --defer-ensemble-restart \
            --pods ensemble

      - name: Restart affected application pods
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          SVO_ADAPTER_GEO_ACTOR_ID: ${{ vars.SVO_ADAPTER_GEO_ACTOR_ID }}
          RESTART_SERVICES: ${{ needs.plan.outputs.restart_services }}
          SCHEMA_CHANGED: ${{ needs.plan.outputs.schema_changed }}
        run: |
          set -euo pipefail
          APPLICATION_SERVICES="$(python - "$RESTART_SERVICES" "$SCHEMA_CHANGED" <<'PY'
          import sys
          excluded = {"postgres", "redis"}
          if sys.argv[2] == "true":
              excluded.add("graphql")
          print(",".join(service for service in sys.argv[1].split(",") if service and service not in excluded))
          PY
          )"
          if [[ -n "$APPLICATION_SERVICES" ]]; then
            python deploy/tapis/register_mint_stack.py \
              --restart-existing-pods "$APPLICATION_SERVICES"
          else
            echo "No application pod restarts required"
          fi

      - name: Summary
        run: |
          echo "## MINT dev selective deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: `${{ needs.plan.outputs.source_sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built: `${{ needs.plan.outputs.build_services || 'none' }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restarted: `${{ needs.plan.outputs.restart_services }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: `${{ needs.plan.outputs.image_tag }}`" >> "$GITHUB_STEP_SUMMARY"
