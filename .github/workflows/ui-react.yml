name: UI React — Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE_REPOSITORY: ghcr.io/mintproject
  # Deliberately distinct from the legacy UI's mint-ui-lit image, so the two are
  # unmistakable while both exist.
  DOCKER_IMAGE_NAME: mint-ui-react

defaults:
  run:
    working-directory: ui-react

concurrency:
  group: ui-react-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npx tsc -b

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ui-react/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-react-dist
          path: ui-react/dist/
          retention-days: 7

  publish:
    name: Publish image
    needs: [lint, typecheck, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: tags
        run: |
          # Docker tags forbid '/', so feature branches publish rather than fail.
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          TAGS="${DOCKER_IMAGE_REPOSITORY}/${DOCKER_IMAGE_NAME}:${SAFE_BRANCH}"
          TAGS="${TAGS},${DOCKER_IMAGE_REPOSITORY}/${DOCKER_IMAGE_NAME}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            TAGS="${TAGS},${DOCKER_IMAGE_REPOSITORY}/${DOCKER_IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ui-react
          file: ui-react/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
