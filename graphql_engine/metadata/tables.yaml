- table:
    name: modelcatalog_etl_process
    schema: public
  array_relationships:
  - name: contracts
    using:
      foreign_key_constraint_on:
        column: etl_process_id
        table:
          name: modelcatalog_etl_process_contract
          schema: public
  insert_permissions:
  - role: user
    permission:
      check: {}
      columns: [id, label, description, version, owner_username, visibility, runtime_kind, runtime_json]
  select_permissions:
  - role: anonymous
    permission:
      columns: [id, label, description, version, owner_username, visibility, runtime_kind, runtime_json, created_at, updated_at]
      filter: {visibility: {_eq: public}}
  - role: user
    permission:
      columns: [id, label, description, version, owner_username, visibility, runtime_kind, runtime_json, created_at, updated_at]
      filter: {_or: [{visibility: {_eq: public}}, {visibility: {_eq: shared}}, {owner_username: {_eq: X-Hasura-User-Id}}]}
- table:
    name: modelcatalog_etl_process_contract
    schema: public
  object_relationships:
  - name: etl_process
    using:
      foreign_key_constraint_on: etl_process_id
  insert_permissions:
  - role: user
    permission:
      check: {}
      columns: [etl_process_id, role, position, standard_variable_uri, unit, format, dimensionality, spatial_type, crs_requirement, temporal_resolution, schema_requirement_json]
  select_permissions:
  - role: anonymous
    permission:
      columns: [role, position, standard_variable_uri, unit, format]
      filter:
        etl_process:
          visibility:
            _eq: public
  - role: user
    permission:
      columns: [etl_process_id, role, position, standard_variable_uri, unit, format, dimensionality, spatial_type, crs_requirement, temporal_resolution, schema_requirement_json]
      filter: {}
